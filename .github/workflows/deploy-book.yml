name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "report_book/**"
      - ".github/workflows/deploy-book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  BASE_URL: /Arxiv-Project-Group10-Report
  JB_ALLOW_NODEENV: "no"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: report_book
        shell: bash
    steps:
      - name: Checkout report source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.1"
          cache: pip
          cache-dependency-path: report_book/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.17.0"
          package-manager-cache: false

      - name: Install pinned Jupyter Book
        run: python -m pip install --requirement requirements.txt

      - name: Build HTML
        run: python -m jupyter_book build --html --strict --ci

      - name: Upload generated website only
        uses: actions/upload-pages-artifact@v4
        with:
          # Internal documents at the repository root are outside this artifact.
          path: report_book/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
